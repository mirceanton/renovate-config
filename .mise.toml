[tools]
node = "latest"
"npm:renovate" = { version = "latest", trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"] }

task = "latest"
gh = "latest"
actionlint = "latest"
"npm:prettier" = "latest"

[settings]
# Hold back freshly published tool releases (supply-chain protection).
minimum_release_age = "3d"
